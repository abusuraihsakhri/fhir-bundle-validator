name: FHIR Bundle Validator checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Syntax and Python regression tests
        run: |
          python -m compileall -q agents bundle_validation.py cli.py fhir_validator.py enrichment.py
          python -m pytest -q
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/validator.js
      - run: node --check web/app.js
      - run: node --test tests/test_browser_validator.cjs tests/test_browser_app.cjs
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fhir-bundle-validator:ci .
